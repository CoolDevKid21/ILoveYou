<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For Noor</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--cream:#fff4e8;--blush:#ffc9d4;--cocoa:#6b4636;--berry:#e8567c}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;touch-action:none}
body{font-family:'Fredoka','Trebuchet MS',system-ui,sans-serif;color:var(--cocoa);
background:radial-gradient(circle at 50% 35%,var(--cream) 0%,#ffdfd3 55%,var(--blush) 100%)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
header{position:fixed;top:calc(env(safe-area-inset-top,0px) + 18px);left:0;right:0;text-align:center;pointer-events:none;padding:0 16px}
h1{font-size:1.7rem;font-weight:600}
header p{opacity:.65;margin-top:4px;font-size:.95rem}
#bubble{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 110px);transform:translateX(-50%) scale(.8);
background:#fff;border-radius:22px;padding:12px 18px;max-width:86vw;text-align:center;font-size:1.05rem;
box-shadow:0 6px 20px rgba(107,70,54,.15);opacity:0;transition:opacity .25s,transform .25s;pointer-events:none}
#bubble.show{opacity:1;transform:translateX(-50%) scale(1)}
.btn{font:inherit;font-weight:600;font-size:1.05rem;color:#fff;background:var(--berry);border:0;border-radius:999px;
padding:13px 26px;box-shadow:0 5px 0 #b83d5f;cursor:pointer;max-width:90vw;line-height:1.25}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b83d5f}
.btn:focus-visible{outline:3px solid var(--cocoa);outline-offset:3px}
#check{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 26px);transform:translateX(-50%);width:max-content}
#check:active{transform:translateX(-50%) translateY(3px)}
.ov{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;align-items:center;justify-content:center;gap:20px;
padding:24px;text-align:center;background:rgba(255,236,230,.94)}
.ov.on{display:flex}
.card{background:#fff;border-radius:26px;padding:22px 24px;max-width:min(92vw,420px);box-shadow:0 8px 28px rgba(107,70,54,.16);font-size:1.25rem;line-height:1.4}
.x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);right:16px;width:46px;height:46px;border-radius:50%;border:0;
background:#fff;color:var(--cocoa);font-size:1.3rem;box-shadow:0 4px 12px rgba(107,70,54,.2);cursor:pointer}
#heart{width:min(70vw,280px);cursor:pointer;overflow:visible}
.big{font-size:1.9rem;font-weight:600;color:var(--berry)}
.env{position:relative;width:250px;height:165px;cursor:pointer;animation:bob 2s ease-in-out infinite;perspective:600px}
.env>*{position:absolute}
.env .back{inset:0;background:#f08fae;border-radius:8px}
.env .paper{left:14px;right:14px;top:10px;bottom:10px;background:#fff;border-radius:6px;transition:transform .6s .3s}
.env .pocket{inset:0;background:#ffb3c8;border-radius:8px;clip-path:polygon(0 0,50% 56%,100% 0,100% 100%,0 100%)}
.env .flap{left:0;right:0;top:0;height:100%;background:#ff9bb8;border-radius:8px 8px 0 0;clip-path:polygon(0 0,100% 0,50% 56%);
transform-origin:top;transition:transform .5s,opacity .2s .35s}
.env .seal{left:50%;top:44%;transform:translate(-50%,-50%);font-size:1.7rem;color:#fff;transition:opacity .2s}
.env.open .flap{transform:rotateX(180deg);opacity:0}
.env.open .paper{transform:translateY(-62px)}
.env.open .seal{opacity:0}
.env.open{animation:none}
@keyframes bob{50%{transform:translateY(-8px)}}
#ovLetter{background:rgba(255,214,226,.97)}
.letter{background:#fff0f4;border:3px dashed #ffb3c7;border-radius:22px;padding:22px 22px 26px;width:min(94vw,460px);
max-height:72vh;overflow:auto;text-align:left;touch-action:pan-y;box-shadow:0 10px 30px rgba(232,86,124,.18)}
.letter h2{font-family:'Caveat','Segoe Script',cursive;font-size:2.3rem;color:var(--berry);margin-bottom:8px;text-align:center}
#typed{font-family:'Caveat','Segoe Script',cursive;font-size:1.6rem;line-height:1.35;white-space:pre-wrap;color:var(--cocoa)}
#typed.typing::after{content:'|';animation:blink .7s steps(1) infinite;color:var(--berry)}
@keyframes blink{50%{opacity:0}}
.heart,.kiss{position:fixed;color:var(--berry);pointer-events:none;z-index:20}
.heart{font-size:1.6rem;animation:up 1.4s ease-out forwards}
@keyframes up{to{transform:translate(var(--dx),-150px) scale(1.3);opacity:0}}
.kiss{font-size:2rem;opacity:0;animation:fly 1.9s ease-out forwards}
@keyframes fly{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}15%{opacity:1}
100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(var(--s));opacity:0}}
@media (prefers-reduced-motion:reduce){.heart,.kiss,.env{animation-duration:.01s}}
</style>
</head>
<body>
<header><h1 id="title"></h1><p id="sub"></p></header>
<div id="bubble" role="status" aria-live="polite"></div>
<button class="btn" id="check">check on what ahemed is doing</button>

<section class="ov" id="ovHeart">
  <button class="x" id="xHeart" hidden aria-label="Close">&#10005;</button>
  <p id="heartHint" class="card">Tap the heart to fill it with love</p>
  <svg id="heart" viewBox="0 0 32 29" role="button" aria-label="Heart, tap to fill">
    <defs><clipPath id="fillClip"><rect id="fillRect" x="0" y="29" width="32" height="29"/></clipPath></defs>
    <path d="M16 27.5C16 27.5 2 18.5 2 9.5C2 5 5.4 2 9.4 2C12.5 2 15 3.8 16 6.3C17 3.8 19.5 2 22.6 2C26.6 2 30 5 30 9.5C30 18.5 16 27.5 16 27.5Z" fill="#ffe0e8" stroke="#e8567c" stroke-width="1"/>
    <path d="M16 27.5C16 27.5 2 18.5 2 9.5C2 5 5.4 2 9.4 2C12.5 2 15 3.8 16 6.3C17 3.8 19.5 2 22.6 2C26.6 2 30 5 30 9.5C30 18.5 16 27.5 16 27.5Z" fill="#e8567c" clip-path="url(#fillClip)"/>
  </svg>
  <p id="heartDone" class="big" hidden>i love you so much</p>
</section>

<section class="ov" id="ovSurprise">
  <p class="card">Oh so he was making you a surprise to cheer you up</p>
  <button class="btn" id="okSurprise">Aww</button>
</section>

<section class="ov" id="ovEnv">
  <p class="card">Oh an envelope from ahemed, wanna open it and know what he said?</p>
  <div class="env" id="env" role="button" aria-label="Open the envelope" tabindex="0">
    <div class="back"></div><div class="paper"></div><div class="pocket"></div><div class="flap"></div><span class="seal">&#9829;</span>
  </div>
  <p style="opacity:.6">tap the envelope</p>
</section>

<section class="ov" id="ovLetter">
  <div class="letter" id="letter"><h2>For my Nony &#128158;</h2><p id="typed"></p></div>
  <button class="btn" id="closeLetter" hidden>Close</button>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ===== EDIT ME ===== */
const CONFIG = {
  title: "Noor, you are so loved",
  subtitle: "Poke the cats. Go on.",
  messages: [
    "Ms. Cinnamon Toast Crunch, you're my favorite person.",
    "Tiny steps still count. Proud of you.",
    "Smile, it's mandatory.",
    "You don't have to be okay today. I'm here.",
    "You make my world softer.",
    "Rest is productive too.",
    "Nobody is cuter than you. Fact."
  ],
  heartTaps: 10,
  bottom: { body: 0xbdb0a4, ear: 0xf2a7b5, cheek: 0xff9eb5 },  // grey cat
  top:    { body: 0xf8f8f6, ear: 0xf2a7b5, cheek: 0xff9eb5 }   // white cat
};
const LETTER = `Hey Nony, i just wanted you to know that i love you so much \u{1F49E} and you're so dear to my heart and i can't bear to see my dear darling unhappy. And I'm so so grateful, so lucky and i feel so special having someone this smart, this beautiful, talented & so important to my life. Never thought that i'd be with such an amazing person one day but here i am. And it turned out to be noor, to be my noor my darling. And i love everything about you and I believe in you that you'll do something big in this life`;
/* =================== */
const $ = id => document.getElementById(id);
$('title').textContent = CONFIG.title; $('sub').textContent = CONFIG.subtitle;

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, .1, 100);
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff, 0xffd6c9, .95));
const sun = new THREE.DirectionalLight(0xffffff, .7); sun.position.set(3,6,6); scene.add(sun);

const mat = (c, r=.85) => new THREE.MeshStandardMaterial({color:c, roughness:r});
const ball = (r, c, sx=1, sy=1, sz=1) => { const m = new THREE.Mesh(new THREE.SphereGeometry(r,32,24), mat(c)); m.scale.set(sx,sy,sz); return m; };

function makeCat(col, o={}){
  const g = new THREE.Group(), dark = 0x3a221a;
  g.add(ball(1, col.body, .95, .85, .85));
  const head = new THREE.Group(); head.position.y = 1.15; g.add(head);
  head.add(ball(1, col.body, 1.2, .92, 1));
  const open = new THREE.Group(), happy = new THREE.Group(); let pawR;
  [-1,1].forEach(s => {
    const ear = new THREE.Mesh(new THREE.ConeGeometry(.36,.62,16), mat(col.body)); ear.position.set(s*.78,.78,.05); ear.rotation.z = -s*.4; head.add(ear);
    const inner = new THREE.Mesh(new THREE.ConeGeometry(.2,.4,16), mat(col.ear)); inner.position.set(s*.76,.74,.17); inner.rotation.z = -s*.4; head.add(inner);
    const e = ball(.09, dark, 1, 1.3, .5); e.position.set(s*.45,.05,.93); open.add(e);
    const h = new THREE.Mesh(new THREE.TorusGeometry(.085,.022,8,16,Math.PI), mat(dark)); h.position.set(s*.45,.02,.95); happy.add(h);
    const ch = ball(.17, col.cheek, 1, .6, .3); ch.position.set(s*.72,-.2,.8); ch.rotation.y = s*.5; head.add(ch);
    const m = new THREE.Mesh(new THREE.TorusGeometry(.05,.013,8,12,Math.PI), mat(dark)); m.position.set(s*.05,-.12,.985); m.rotation.z = Math.PI; head.add(m);
    const foot = ball(.22, col.body, 1.1, .7, 1.2); foot.position.set(s*.45,-.75,.45); g.add(foot);
    const paw = ball(.2, col.body); paw.position.set(...(o.laptop ? [s*.4,-.33,1.0] : [s*.42,-.3,.72])); g.add(paw);
    if(s === 1) pawR = paw;
  });
  const nose = ball(.035, col.cheek, 1.3, 1, 1); nose.position.set(0,-.03,.995); head.add(nose);
  const tail = ball(.26, col.body); tail.position.set(-.85,-.35,-.55); g.add(tail);
  if(o.laptop){
    const L = new THREE.Group(), pink = 0xf1b6d4;
    L.add(new THREE.Mesh(new THREE.BoxGeometry(1.25,.07,.8), mat(pink,.6)));
    const lid = new THREE.Mesh(new THREE.BoxGeometry(1.25,.8,.06), mat(pink,.6)); lid.position.set(0,.4,.4); lid.rotation.x = -.28; L.add(lid);
    const logo = ball(.09, 0xffffff, 1, 1, .3); logo.position.z = .04; lid.add(logo);
    L.position.set(0,-.42,1.15); g.add(L);
  }
  happy.visible = o.alwaysHappy; open.visible = !o.alwaysHappy; head.add(open, happy);
  const cat = {g, head, open, happy, pawR, pos:0, vel:0, happyUntil:0, base:1, always:!!o.alwaysHappy};
  g.userData.cat = cat; return cat;
}

const root = new THREE.Group(); scene.add(root);
const catLow = makeCat(CONFIG.bottom, {laptop:true});
const catHigh = makeCat(CONFIG.top, {alwaysHappy:true});
catHigh.base = .5; catHigh.g.scale.setScalar(.5); catHigh.g.position.set(.1,2.4,0); catHigh.g.rotation.z = -.2;
root.add(catLow.g, catHigh.g);
const cats = [catLow, catHigh];
const pawBase = catLow.pawR.position.clone(), mouth = new THREE.Vector3(.32,.92,1.05), out = new THREE.Vector3(.7,1.2,1.4);

const c = document.createElement('canvas'); c.width = c.height = 64;
const cx = c.getContext('2d'), gr = cx.createRadialGradient(32,32,2,32,32,32);
gr.addColorStop(0,'rgba(107,70,54,.35)'); gr.addColorStop(1,'rgba(107,70,54,0)');
cx.fillStyle = gr; cx.fillRect(0,0,64,64);
const shadow = new THREE.Mesh(new THREE.PlaneGeometry(4.6,4.6), new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c), transparent:true, depthWrite:false}));
shadow.rotation.x = -Math.PI/2; shadow.position.y = -.93; scene.add(shadow);

function resize(){
  const w = innerWidth, h = innerHeight, a = w/h;
  renderer.setSize(w,h); camera.aspect = a;
  camera.position.set(0, 2.2, Math.max(10.5, 4.8/(.728*a)));
  camera.lookAt(0,1.7,0); camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

/* bubbles + hearts */
const bubble = $('bubble'); let bubbleT, msgI = 0;
function say(t){ bubble.textContent = t; bubble.classList.add('show'); clearTimeout(bubbleT); bubbleT = setTimeout(()=>bubble.classList.remove('show'), 3000); }
function hearts(x, y, n=5){
  for(let i=0;i<n;i++){
    const s = document.createElement('span'); s.className = 'heart'; s.textContent = '\u2665';
    s.style.left = (x + (Math.random()-.5)*60) + 'px'; s.style.top = (y + (Math.random()-.5)*30) + 'px';
    s.style.setProperty('--dx', ((Math.random()-.5)*90) + 'px'); s.style.animationDelay = (i*60) + 'ms';
    document.body.appendChild(s); setTimeout(()=>s.remove(), 1700);
  }
}
function kissHearts(){
  const v = new THREE.Vector3(); catLow.pawR.getWorldPosition(v); v.project(camera);
  const x = (v.x*.5+.5)*innerWidth, y = (-v.y*.5+.5)*innerHeight;
  for(let i=0;i<9;i++){
    const s = document.createElement('span'); s.className = 'kiss'; s.textContent = '\u2665';
    s.style.left = x+'px'; s.style.top = y+'px';
    s.style.setProperty('--dx', (Math.random()-.5)*180+'px'); s.style.setProperty('--dy', -(60+Math.random()*200)+'px');
    s.style.setProperty('--s', (2+Math.random()*2.5).toFixed(1)); s.style.animationDelay = i*90+'ms';
    document.body.appendChild(s); setTimeout(()=>s.remove(), 3000);
  }
}
const now = () => performance.now()/1000;
const poke = k => { k.vel += 7; k.happyUntil = now() + 1.5; };

/* tap cats, drag to spin */
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2(), cv = renderer.domElement;
let yaw = 0, down = null, moved = false;
cv.addEventListener('pointerdown', e => { down = {x:e.clientX}; moved = false; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e => { if(!down) return; const dx = e.clientX - down.x; if(Math.abs(dx) > 3) moved = true; yaw += dx*.01; down.x = e.clientX; });
cv.addEventListener('pointerup', e => {
  down = null; if(moved) return;
  ptr.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1); ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObject(root, true)[0]; if(!hit) return;
  let o = hit.object; while(o && !o.userData.cat) o = o.parent; if(!o) return;
  poke(o.userData.cat); hearts(e.clientX, e.clientY); say(CONFIG.messages[msgI++ % CONFIG.messages.length]);
});

/* story flow */
function show(id){ document.querySelectorAll('.ov').forEach(o => o.classList.toggle('on', o.id === id)); $('check').style.display = id ? 'none' : ''; }
let level = 0;
const setFill = () => $('fillRect').setAttribute('y', 29*(1-level/CONFIG.heartTaps));
$('check').onclick = () => {
  level = 0; setFill(); $('xHeart').hidden = true; $('heartDone').hidden = true;
  $('heartHint').hidden = false; $('heart').style.pointerEvents = ''; show('ovHeart');
};
$('heart').onclick = e => {
  if(level >= CONFIG.heartTaps) return;
  level++; setFill(); hearts(e.clientX, e.clientY, 3);
  $('heart').animate([{transform:'scale(1)'},{transform:'scale(1.1)'},{transform:'scale(1)'}], {duration:180});
  if(level >= CONFIG.heartTaps){
    $('heartHint').hidden = true; $('heartDone').hidden = false; $('xHeart').hidden = false; hearts(innerWidth/2, innerHeight/2, 8);
  }
};
$('xHeart').onclick = () => show('ovSurprise');
$('okSurprise').onclick = () => { $('env').classList.remove('open'); show('ovEnv'); };
const openEnv = () => {
  const env = $('env'); if(env.classList.contains('open')) return;
  env.classList.add('open'); setTimeout(() => { show('ovLetter'); typeLetter(); }, 1100);
};
$('env').onclick = openEnv;
$('env').onkeydown = e => { if(e.key === 'Enter' || e.key === ' ') openEnv(); };

let typeIv;
function typeLetter(){
  const chars = Array.from(LETTER), el = $('typed'), box = $('letter'); let i = 0;
  el.textContent = ''; el.classList.add('typing'); $('closeLetter').hidden = true;
  const finish = () => { clearInterval(typeIv); el.textContent = LETTER; el.classList.remove('typing'); $('closeLetter').hidden = false; };
  typeIv = setInterval(() => { el.textContent += chars[i++]; box.scrollTop = box.scrollHeight; if(i >= chars.length) finish(); }, 32);
  box.onclick = finish;
}
$('closeLetter').onclick = () => { show(null); setTimeout(startKiss, 450); };

/* kiss */
let kt0 = -1, kissed = false;
function startKiss(){ kt0 = now(); kissed = false; catLow.happyUntil = kt0 + 2.3; }

let nextBlink = 2;
(function loop(){
  requestAnimationFrame(loop);
  const t = now(); let tilt = 0;
  if(kt0 > 0){
    const kt = t - kt0, P = catLow.pawR.position;
    if(kt < .5) P.lerpVectors(pawBase, mouth, kt/.5);
    else if(kt < 1) P.copy(mouth);
    else if(kt < 1.4) P.lerpVectors(mouth, out, (kt-1)/.4);
    else if(kt < 2) P.lerpVectors(out, pawBase, (kt-1.4)/.6);
    else { P.copy(pawBase); kt0 = -1; }
    if(kt >= 1 && !kissed){ kissed = true; kissHearts(); say('mwah \u{1F48B}'); }
    tilt = .18*Math.sin(Math.min(kt,2)/2*Math.PI);
  }
  root.rotation.y = yaw + (reduce ? 0 : Math.sin(t*.6)*.22);
  const blink = t > nextBlink && t < nextBlink + .12; if(t > nextBlink + .12) nextBlink = t + 2.5 + Math.random()*2.5;
  cats.forEach((k, i) => {
    k.vel += (-k.pos*90 - k.vel*7) * .016; k.pos += k.vel*.016;
    const breathe = reduce ? 0 : Math.sin(t*2 + i)*.012, p = k.pos*.07;
    k.g.scale.set(k.base*(1+p), k.base*(1-p+breathe), k.base*(1+p));
    k.head.rotation.z = (reduce ? 0 : Math.sin(t*1.2 + i*2)*.05) + (i === 0 ? tilt : 0);
    const happy = k.always || t < k.happyUntil;
    k.happy.visible = happy; k.open.visible = !happy; k.open.scale.y = blink ? .1 : 1;
  });
  renderer.render(scene, camera);
})();
</script>
</body>
</html>
